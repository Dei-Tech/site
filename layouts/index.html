<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} | {{ .Site.Title }}</title>
    <meta name="description" content="{{ .Description | default .Site.Params.description }}">
    
    <!-- Redirect to WIP page -->
    <meta http-equiv="refresh" content="0; url={{ .Params.redirect_to | default "/wip/" }}">
    <link rel="canonical" href="{{ .Params.redirect_to | default "/wip/" | absURL }}">
    
    <!-- Preload fonts for smooth loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Hugo Asset Pipeline for CSS -->
    {{ $css := resources.Get "css/redirect.css" }}
    {{ $style := $css | resources.Minify | resources.Fingerprint }}
    <link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}">
</head>
<body>
    <div class="redirect-message">
        <h1>DeiTech</h1>
        <p>Redirecting to our work in progress page<span class="loading-dots"></span></p>
        <a href="{{ .Params.redirect_to | default "/wip/" }}" class="redirect-link">
            Continue to Site →
        </a>
    </div>
    
    <!-- Hugo Asset Pipeline for JavaScript -->
    {{ $js := resources.Get "js/redirect.js" }}
    {{ $script := $js | resources.Minify | resources.Fingerprint }}
    <script src="{{ $script.RelPermalink }}" integrity="{{ $script.Data.Integrity }}"></script>
    
    <!-- Pass redirect URL to JavaScript -->
    <script>
        document.body.dataset.redirectUrl = "{{ .Params.redirect_to | default "/wip/" }}";
    </script>
</body>
</html>
