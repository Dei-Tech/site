# Production deployment - only on successful PR merge to main
# Modified from Firebase CLI auto-generation

name: Deploy to Production (Firebase Hosting)
on:
  pull_request:
    types: [closed]
    branches:
      - main
jobs:
  build_and_deploy:
    # Only run if the PR was actually merged (not just closed)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true
          
      - name: Build Hugo site
        run: hugo --minify
        
      - name: Deploy to Firebase Hosting (Production)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEITECH_SITE_C5C6F }}
          channelId: live
          projectId: deitech-site-c5c6f
