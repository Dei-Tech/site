# Continuous Integration Workflow
# Purpose: Build validation and quality checks for main branch health
# Runs on: pushes to main + pull requests
# Does NOT deploy - only validates build

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Build & Validate
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        
      - name: 🏗️ Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true
          
      - name: 🔍 Validate Hugo configuration
        run: |
          echo "🔧 Checking Hugo configuration..."
          hugo config
          
      - name: 📦 Build Hugo site
        run: |
          echo "🏗️ Building Hugo site..."
          hugo --minify --verbose
          
      - name: ✅ Verify build output
        run: |
          echo "📊 Build verification:"
          echo "✓ Public directory exists: $(test -d public && echo 'YES' || echo 'NO')"
          echo "✓ Index.html exists: $(test -f public/index.html && echo 'YES' || echo 'NO')"
          echo "✓ CSS assets exist: $(test -f public/css/*.css && echo 'YES' || echo 'NO')"
          echo "✓ JS assets exist: $(test -f public/js/*.js && echo 'YES' || echo 'NO')"
          echo ""
          echo "📁 Generated files:"
          find public -type f | head -10
          echo ""
          echo "📏 Build size:"
          du -sh public/
          
      - name: 🧪 Basic HTML validation
        run: |
          echo "🔍 Checking for basic HTML structure..."
          if grep -q "<html" public/index.html; then
            echo "✓ Valid HTML structure found"
          else
            echo "❌ Invalid HTML structure"
            exit 1
          fi
          
          if grep -q "<title>" public/index.html; then
            echo "✓ Page title found"
          else
            echo "⚠️ No page title found"
          fi
